# Velum — Phase 1: serve the static prototype. Replace velum.example with your domain.
# Note: add_header inside a location replaces the server-level ones, so the security
# headers are repeated wherever a location adds its own header.

# HSTS only over HTTPS (an empty value is not sent).
map $scheme $velum_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name velum.example www.velum.example;

    root /var/www/velum;
    index index.html;
    server_tokens off;

    # The prototype is one file with inline script and style, plus Google Fonts.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security $velum_hsts always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $velum_hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
