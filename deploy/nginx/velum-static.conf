# Velum — Phase 1: serve the static prototype. Replace velum.example with your domain.
# Note: add_header inside a location replaces the server-level ones, so the security
# headers are repeated wherever a location adds its own header.
server {
    listen 80;
    listen [::]:80;
    server_name velum.example www.velum.example;

    root /var/www/velum;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
