[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "../packages/config" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 256
depth = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# Public immutables keep camelCase on purpose: they are ABI getters (vault(), usdg()) the web app reads.
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable", "named-struct-fields", "unwrapped-modifier-logic"]
# Tests mirror the contract formulas with bounded casts on purpose; lint production code and scripts.
ignore = ["test/**/*.sol"]
