# Continuous integration on GitHub-hosted runners (free for public repositories), audit SC-09.
# Actions are pinned by commit SHA (the tag is in the comment); Dependabot proposes updates weekly.
# Node 22 LTS only: Node 20 reached end of life in April 2026 and the owner moved Velum to Node 22.
name: CI

on:
  # Pushes to the development branch, and pull requests (Dependabot's included) once each.
  push:
    branches: ['claude/new-session-93ke66', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test, build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velum
          POSTGRES_PASSWORD: velum-ci
          POSTGRES_DB: velum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velum -d velum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The Postgres-backed tests run against this scratch database (they are skipped without it).
      TEST_DATABASE_URL: postgresql://velum:velum-ci@127.0.0.1:5432/velum_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate the test database, then check the schema has no drift
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm --filter @velum/db exec prisma migrate deploy
          pnpm --filter @velum/db exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Build (web for testnet)
        env:
          NEXT_PUBLIC_VELUM_NETWORK: testnet
          NEXT_PUBLIC_CHAIN_ID: '46630'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: https://velum.example
        run: pnpm -r build
      - name: Build the web for mainnet
        env:
          NEXT_PUBLIC_VELUM_NETWORK: mainnet
          NEXT_PUBLIC_CHAIN_ID: '4663'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: https://velum.example
        run: pnpm --filter @velum/web build
      - name: Third-party notices are up to date (apps/web/public/third-party-notices.txt)
        run: pnpm --filter @velum/web notices:check
      # Blocking (CI-F2): any advisory in the production tree fails the build unless it is triaged below.
      # Mitigate with an exact override in package.json "pnpm.overrides" where a compatible fix exists;
      # list an advisory here only when none does, with why Velum cannot reach it. Remove an entry as soon
      # as a fixed version can be used. A failed or unreadable audit also fails the build.
      - name: Audit production dependencies (blocking, triaged exceptions listed)
        run: |
          ignore=(
            # deepmerge-ts 7.1.5 (high, stack exhaustion on recursive object graphs), via
            # @prisma/client > prisma > @prisma/config. Only the Prisma CLI loads it, to merge the
            # repository's own Prisma config during generate/migrate on CI and the server; it never sees
            # user input and is not part of the web bundle or the API's request path. The fix is
            # deepmerge-ts 8 (a major version Prisma 6 does not support).
            GHSA-ggr8-5vv4-36mx
            # zod 3.22.4 (high, memory exhaustion validating oversized constrained collections), via
            # @reown/appkit-wallet 1.7.8 (WalletConnect's embedded-wallet frame, part of the Apache-2.0
            # WalletConnect line the owner chose: ethereum-provider 2.21.x with AppKit 1.7.x), also linked
            # as abitype's optional zod peer under viem. Since the wagmi 3 upgrade Base Account (and with
            # it @coinbase/cdp-sdk and zod 3.25.76) is no longer installed. Not used: the web builds
            # contain no zod code at all (tree-shaken; checked in .next/static on both networks), the API
            # and workers do not depend on zod 3, and no user input could reach it anyway. The fix is zod
            # 4, which AppKit 1.7.x does not support; AppKit versions that do are not Apache-2.0.
            GHSA-mrhx-c7xc-m3w5
          )
          out="$RUNNER_TEMP/audit.json"
          pnpm audit --prod --json > "$out" || true
          IGNORE="${ignore[*]}" node -e '
            const fs = require("node:fs");
            const ignore = new Set(process.env.IGNORE.split(" ").filter(Boolean));
            let a;
            try { a = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch (e) { console.error("pnpm audit gave no readable report:", e.message); process.exit(1); }
            if (!a || typeof a.advisories !== "object" || a.error) { console.error("pnpm audit failed:", JSON.stringify(a && a.error)); process.exit(1); }
            const found = Object.values(a.advisories);
            const open = found.filter((v) => !ignore.has(v.github_advisory_id));
            for (const v of found) console.log(`${ignore.has(v.github_advisory_id) ? "triaged" : "OPEN   "} ${v.github_advisory_id} ${v.severity} ${v.module_name} ${v.vulnerable_versions}: ${v.title}`);
            const stale = [...ignore].filter((id) => !found.some((v) => v.github_advisory_id === id));
            if (stale.length) console.log(`Triaged but no longer reported (remove from the list): ${stale.join(", ")}`);
            if (open.length) { console.error(`${open.length} untriaged advisory(ies): fix or triage them.`); process.exit(1); }
            console.log(`No untriaged advisories (${found.length} triaged).`);
          ' "$out"

  shell:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Ubuntu's ShellCheck package (0.9.x on 24.04), the same version the deploy scripts were checked with.
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck the deploy scripts (CI-F3)
        run: shellcheck -x deploy/*.sh deploy/lib/*.sh

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
      - name: Format check (CI-F3)
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Lint production contracts and scripts (CI-F3; tests are excluded on purpose, see foundry.toml)
        run: forge lint src script
      - name: Test (CI profile, more fuzz and invariant runs)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test
