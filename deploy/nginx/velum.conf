# Velum — full stack (Phase 2+). Replace velum.example with your domain.
# Certbot adds HTTPS and the HTTP→HTTPS redirect when you run:
#   certbot --nginx -d velum.example -d www.velum.example --redirect
#
# Security headers (incl. HSTS and the Content-Security-Policy) live in
# /etc/nginx/snippets/velum-security-headers.conf, which deploy/deploy.sh regenerates from .env on
# every release so the CSP's connect-src follows the configured network and RPC. add_header in a
# location replaces the server-level ones, so every location that adds a header includes it again.

limit_req_zone $binary_remote_addr zone=velum_api:10m rate=10r/s;

# HSTS only over HTTPS (an empty value is not sent). No includeSubDomains: other hosts under the
# domain may still serve plain HTTP on a shared server.
map $scheme $velum_hsts {
    https   "max-age=31536000";
    default "";
}

upstream velum_web { server 127.0.0.1:3000; keepalive 32; }
upstream velum_api { server 127.0.0.1:4000; keepalive 32; }

# One origin only: www redirects to the apex with a 301. The private-account sign message is bound to
# the page's host, so serving both names would give each user two different private accounts.
# Certbot adds HTTPS to this block too when www is in the certificate (server-setup.sh: WWW=auto|yes),
# so https://www.velum.example also lands on https://velum.example.
server {
    listen 80;
    listen [::]:80;
    server_name www.velum.example;
    server_tokens off;
    include snippets/velum-security-headers.conf;
    return 301 https://velum.example$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name velum.example;

    client_max_body_size 2m;
    server_tokens off;

    include snippets/velum-security-headers.conf;
    # Next.js sends the basic headers too (defence in depth for runs without Nginx); keep one copy.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    # API → Fastify (strip /api prefix). Over the limit, answer in the API's JSON error format.
    location /api/ {
        limit_req zone=velum_api burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @velum_api_rate_limited;
        proxy_pass http://velum_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @velum_api_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        include snippets/velum-security-headers.conf;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down and try again."}}';
    }

    # Phase 4 will need cross-origin isolation on /app for multithreaded WASM proving.
    # Do not enable it before then: COOP same-origin breaks wallet popups (Coinbase) and
    # COEP require-corp blocks WalletConnect's modal assets. When the prover lands, add
    #   Cross-Origin-Opener-Policy same-origin-allow-popups
    #   Cross-Origin-Embedder-Policy credentialless
    # here (plus the headers snippet include) and test every wallet.
    location /app {
        proxy_pass http://velum_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next image optimizer is disabled; refuse its endpoint outright (audit web M5).
    location /_next/image { return 404; }

    # Next.js static assets: long cache
    location /_next/static/ {
        proxy_pass http://velum_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Next sends Cache-Control too; keep Nginx's. A location-level proxy_hide_header replaces the
        # server-level list, so the four above are repeated.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/velum-security-headers.conf;
    }

    location / {
        proxy_pass http://velum_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
