# Velum — full stack (Phase 2+). Replace velum.example with your domain.
# Certbot adds the 443 server block and redirect when you run: certbot --nginx -d velum.example
# Note: add_header inside a location replaces the server-level ones, so the security
# headers are repeated in locations that add their own headers.

limit_req_zone $binary_remote_addr zone=velum_api:10m rate=10r/s;

upstream velum_web { server 127.0.0.1:3000; keepalive 32; }
upstream velum_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name velum.example www.velum.example;

    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    # API → Fastify (strip /api prefix)
    location /api/ {
        limit_req zone=velum_api burst=40 nodelay;
        proxy_pass http://velum_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Phase 4 will need cross-origin isolation on /app for multithreaded WASM proving.
    # Do not enable it before then: COOP same-origin breaks wallet popups (Coinbase) and
    # COEP require-corp blocks WalletConnect's modal assets. When the prover lands, add
    #   Cross-Origin-Opener-Policy same-origin-allow-popups
    #   Cross-Origin-Embedder-Policy credentialless
    # here (plus the three security headers below) and test every wallet.
    location /app {
        proxy_pass http://velum_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets: long cache
    location /_next/static/ {
        proxy_pass http://velum_web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        proxy_pass http://velum_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
